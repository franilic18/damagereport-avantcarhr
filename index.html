<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVANT CAR – Damage Report</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:22px;text-align:center;font-size:25px;font-weight:800;letter-spacing:1.5px}
.card{max-width:620px;margin:28px auto;background:#fff;border-radius:14px;padding:26px;box-shadow:0 3px 18px #0001}
.progress{font-size:13px;color:#777;margin-bottom:12px}.bar{height:6px;background:#ddd;border-radius:9px;overflow:hidden}.fill{height:100%;background:#111;width:14%;transition:.2s}
h1{font-size:27px;margin:20px 0 8px}.sub{color:#666;margin-bottom:22px;line-height:1.45}
label{display:block;font-weight:700;margin:17px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff}textarea{min-height:120px;resize:vertical}
button{padding:14px 18px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#eee;color:#111}.full{width:100%;margin-top:16px}.actions{display:flex;gap:10px;margin-top:24px}.actions button{flex:1}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.langs button{background:#eee;color:#111}.langs button.active{background:#111;color:#fff}
.helpbox{padding:17px;background:#f5f5f5;border-radius:10px;line-height:1.55;margin-bottom:15px}.summary{background:#f7f7f7;border-radius:10px;padding:15px}
.summary div{padding:9px 0;border-bottom:1px solid #ddd}.summary div:last-child{border:0}.summary b{display:block;font-size:13px;color:#666;margin-bottom:3px}
.status{margin-top:12px;color:#b00020;font-size:14px;min-height:20px}.success{text-align:center;padding:25px 5px}.hidden{display:none!important}
.photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.photo-preview img{width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>
<header>AVANT CAR</header>
<div class="card">
<div class="progress"><span id="stepLabel"></span> <span id="num">1</span> <span id="of"></span> 7</div>
<div class="bar"><div class="fill" id="fill"></div></div>

<section id="step1">
<h1 id="s1t"></h1><div class="sub" id="s1d"></div>
<div class="langs">
<button id="lang-hr" onclick="setLang('hr')">🇭🇷 Hrvatski</button>
<button id="lang-en" onclick="setLang('en')">🇬🇧 English</button>
<button id="lang-de" onclick="setLang('de')">🇩🇪 Deutsch</button>
<button id="lang-it" onclick="setLang('it')">🇮🇹 Italiano</button>
<button id="lang-fr" onclick="setLang('fr')">🇫🇷 Français</button>
</div>
<button class="full" id="next1" onclick="next()"></button>
</section>

<section id="step2" class="hidden">
<h1 id="s2t"></h1><div class="sub" id="s2d"></div><div class="helpbox" id="helpbox"></div>
<a id="pdfLink" href="./upute.html" target="_blank" rel="noopener">
<button class="full" id="openHelp" type="button"></button></a>
<div class="actions"><button class="secondary" id="back2" onclick="prev()"></button><button id="next2" onclick="next()"></button></div>
</section>

<section id="step3" class="hidden">
<h1 id="s3t"></h1><div class="sub" id="s3d"></div>
<label id="branchL"></label><select id="branch"></select>
<label id="contractL"></label><input id="contract">
<div class="status" id="step3err"></div>
<div class="actions"><button class="secondary" id="back3" onclick="prev()"></button><button id="next3" onclick="next()"></button></div>
</section>

<section id="step4" class="hidden">
<h1 id="s4t"></h1><div class="sub" id="s4d"></div>
<label id="driverL"></label><select id="driverType" onchange="toggleOtherDriver()"></select>
<div id="otherDriver" class="hidden">
<label id="driverNameL"></label><input id="driverName">
<label id="driverEmailL"></label><input id="driverEmail" type="email">
<label id="driverPhoneL"></label><input id="driverPhone" type="tel">
<label id="licenseL"></label><input id="license" type="file" accept="image/*">
</div>
<div class="status" id="step4err"></div>
<div class="actions"><button class="secondary" id="back4" onclick="prev()"></button><button id="next4" onclick="next()"></button></div>
</section>

<section id="step5" class="hidden">
<h1 id="s5t"></h1><div class="sub" id="s5d"></div>
<label id="dateL"></label><input id="date" type="date">
<label id="descL"></label><textarea id="desc"></textarea>
<label id="locL"></label><input id="location">
<button class="full secondary" id="gpsBtn" onclick="getLocation()" type="button"></button>
<div class="status" id="gps"></div>
<label id="photosL"></label><input id="photos" type="file" accept="image/*" multiple>
<div class="sub" id="photoHelp"></div><div class="photo-preview" id="preview"></div>
<div class="status" id="step5err"></div>
<div class="actions"><button class="secondary" id="back5" onclick="prev()"></button><button id="next5" onclick="next()"></button></div>
</section>

<section id="step6" class="hidden">
<h1 id="s6t"></h1><div class="sub" id="s6d"></div><div class="summary" id="summary"></div>
<div class="actions"><button class="secondary" id="back6" onclick="prev()"></button><button id="sendBtn" onclick="send()"></button></div>
</section>

<section id="step7" class="hidden">
<div class="success"><h1 id="s7t"></h1><div class="sub" id="s7d"></div></div>
</section>
</div>

<script>
const branches={
hr:["Zagreb Aerodrom","Zagreb Downtown","Zadar Aerodrom","Split Aerodrom","Split Downtown","Dubrovnik Aerodrom","Dubrovnik Downtown"],
en:["Zagreb Airport","Zagreb Downtown","Zadar Airport","Split Airport","Split Downtown","Dubrovnik Airport","Dubrovnik Downtown"],
de:["Flughafen Zagreb","Zagreb Innenstadt","Flughafen Zadar","Flughafen Split","Split Innenstadt","Flughafen Dubrovnik","Dubrovnik Innenstadt"],
it:["Aeroporto di Zagabria","Zagabria Centro","Aeroporto di Zara","Aeroporto di Spalato","Spalato Centro","Aeroporto di Dubrovnik","Dubrovnik Centro"],
fr:["Aéroport de Zagreb","Zagreb Centre","Aéroport de Zadar","Aéroport de Split","Split Centre","Aéroport de Dubrovnik","Dubrovnik Centre"]
};

const D={
hr:{step:"Korak",of:"od",next:"Nastavi",back:"Natrag",req:"Molimo ispunite sva obavezna polja prije nastavka.",s1t:"Odaberite jezik",s1d:"Odaberite jezik na kojem želite ispuniti prijavu.",s2t:"Kako postupiti?",s2d:"Važne informacije prije podnošenja prijave štete.",open:"Otvori upute",help:"U slučaju štete odmah kontaktirajte AVANT CAR poslovnicu i slijedite njihove upute.",branch:"Poslovnica preuzimanja vozila",contract:"Broj ugovora",s3t:"Podaci o preuzimanju",s3d:"Odaberite poslovnicu i unesite broj ugovora.",s4t:"Vozač",s4d:"Navedite tko je upravljao vozilom u trenutku štetnog događaja.",driver:"Tko je upravljao vozilom u trenutku štetnog događaja?",choose:"-- Odaberite --",main:"Glavni vozač",other:"Druga osoba",name:"Ime i prezime vozača",email:"Email",phone:"Broj telefona",license:"Fotografija vozačke dozvole",s5t:"Podaci o šteti",s5d:"Unesite detalje štete i dodajte fotografije.",date:"Datum štete",desc:"Opis štete",loc:"GPS lokacija",gps:"📍 Dohvati moju lokaciju",photos:"Fotografije štete",photoHelp:"Dodajte najmanje jednu fotografiju.",s6t:"Pregled prijave",s6d:"Provjerite podatke prije završetka.",send:"Završi testnu prijavu",s7t:"✓ TEST USPJEŠAN",s7d:"Podaci nisu poslani niti spremljeni."},
en:{step:"Step",of:"of",next:"Continue",back:"Back",req:"Please complete all required fields before continuing.",s1t:"Select language",s1d:"Select the language you want to use for the report.",s2t:"How to proceed?",s2d:"Important information before submitting a damage report.",open:"Open instructions",help:"In case of damage, contact the AVANT CAR branch immediately and follow their instructions.",branch:"Vehicle pick-up branch",contract:"Contract number",s3t:"Pick-up details",s3d:"Select the branch and enter the contract number.",s4t:"Driver",s4d:"Tell us who was driving the vehicle at the time of the damage.",driver:"Who was driving the vehicle at the time of the damage?",choose:"-- Select --",main:"Main driver",other:"Another person",name:"Driver full name",email:"Email",phone:"Phone number",license:"Driver's licence photo",s5t:"Damage details",s5d:"Enter the damage details and add photos.",date:"Date of damage",desc:"Damage description",loc:"GPS location",gps:"📍 Get my location",photos:"Damage photos",photoHelp:"Add at least one photo.",s6t:"Review report",s6d:"Check your information before finishing.",send:"Finish test report",s7t:"✓ TEST SUCCESSFUL",s7d:"The data was not sent or stored."},
de:{step:"Schritt",of:"von",next:"Weiter",back:"Zurück",req:"Bitte füllen Sie alle Pflichtfelder aus.",s1t:"Sprache auswählen",s1d:"Wählen Sie die Sprache für die Meldung.",s2t:"Wie vorgehen?",s2d:"Wichtige Informationen vor der Schadensmeldung.",open:"Anleitung öffnen",help:"Bei einem Schaden kontaktieren Sie sofort die AVANT CAR Station und befolgen Sie deren Anweisungen.",branch:"Abholstation",contract:"Vertragsnummer",s3t:"Abholdaten",s3d:"Wählen Sie die Station und geben Sie die Vertragsnummer ein.",s4t:"Fahrer",s4d:"Geben Sie an, wer das Fahrzeug zum Zeitpunkt des Schadens gefahren hat.",driver:"Wer hat das Fahrzeug zum Zeitpunkt des Schadens gefahren?",choose:"-- Auswählen --",main:"Hauptfahrer",other:"Andere Person",name:"Vor- und Nachname des Fahrers",email:"E-Mail",phone:"Telefonnummer",license:"Foto des Führerscheins",s5t:"Schadendetails",s5d:"Geben Sie die Schadendetails ein und fügen Sie Fotos hinzu.",date:"Schadendatum",desc:"Schadensbeschreibung",loc:"GPS-Standort",gps:"📍 Standort abrufen",photos:"Schadenfotos",photoHelp:"Mindestens ein Foto hinzufügen.",s6t:"Meldung prüfen",s6d:"Überprüfen Sie Ihre Angaben vor dem Abschluss.",send:"Testmeldung abschließen",s7t:"✓ TEST ERFOLGREICH",s7d:"Die Daten wurden nicht gesendet oder gespeichert."},
it:{step:"Passaggio",of:"di",next:"Continua",back:"Indietro",req:"Compila tutti i campi obbligatori prima di continuare.",s1t:"Seleziona lingua",s1d:"Seleziona la lingua per compilare la segnalazione.",s2t:"Come procedere?",s2d:"Informazioni importanti prima di inviare la segnalazione.",open:"Apri istruzioni",help:"In caso di danno, contatta immediatamente la filiale AVANT CAR e segui le istruzioni.",branch:"Filiale di ritiro",contract:"Numero contratto",s3t:"Dati del ritiro",s3d:"Seleziona la filiale e inserisci il numero di contratto.",s4t:"Conducente",s4d:"Indica chi guidava il veicolo al momento del danno.",driver:"Chi guidava il veicolo al momento del danno?",choose:"-- Seleziona --",main:"Conducente principale",other:"Un'altra persona",name:"Nome e cognome del conducente",email:"Email",phone:"Numero di telefono",license:"Foto della patente",s5t:"Dettagli del danno",s5d:"Inserisci i dettagli del danno e aggiungi le foto.",date:"Data del danno",desc:"Descrizione del danno",loc:"Posizione GPS",gps:"📍 Ottieni posizione",photos:"Foto del danno",photoHelp:"Aggiungi almeno una foto.",s6t:"Riepilogo",s6d:"Controlla i dati prima di terminare.",send:"Completa segnalazione di test",s7t:"✓ TEST RIUSCITO",s7d:"I dati non sono stati inviati né salvati."},
fr:{step:"Étape",of:"sur",next:"Continuer",back:"Retour",req:"Veuillez remplir tous les champs obligatoires.",s1t:"Choisir la langue",s1d:"Choisissez la langue pour remplir la déclaration.",s2t:"Comment procéder ?",s2d:"Informations importantes avant d'envoyer la déclaration.",open:"Ouvrir les instructions",help:"En cas de dommage, contactez immédiatement l'agence AVANT CAR et suivez ses instructions.",branch:"Agence de prise en charge",contract:"Numéro de contrat",s3t:"Informations de prise en charge",s3d:"Sélectionnez l'agence et saisissez le numéro de contrat.",s4t:"Conducteur",s4d:"Indiquez qui conduisait le véhicule au moment du dommage.",driver:"Qui conduisait le véhicule au moment du dommage ?",choose:"-- Sélectionner --",main:"Conducteur principal",other:"Une autre personne",name:"Nom et prénom du conducteur",email:"E-mail",phone:"Numéro de téléphone",license:"Photo du permis de conduire",s5t:"Détails du dommage",s5d:"Décrivez le dommage et ajoutez des photos.",date:"Date du dommage",desc:"Description du dommage",loc:"Position GPS",gps:"📍 Obtenir ma position",photos:"Photos du dommage",photoHelp:"Ajoutez au moins une photo.",s6t:"Vérifier la déclaration",s6d:"Vérifiez vos informations avant de terminer.",send:"Terminer la déclaration de test",s7t:"✓ TEST RÉUSSI",s7d:"Les données n'ont pas été envoyées ni enregistrées."}
};

let lang="hr",current=1;
const $=id=>document.getElementById(id);

function setLang(l){
 lang=l;
 document.documentElement.lang=l;
 const t=D[l];
 $("stepLabel").textContent=t.step;$("of").textContent=t.of;
 $("s1t").textContent=t.s1t;$("s1d").textContent=t.s1d;$("next1").textContent=t.next;
 $("s2t").textContent=t.s2t;$("s2d").textContent=t.s2d;$("helpbox").textContent=t.help;$("openHelp").textContent=t.open;
 $("s3t").textContent=t.s3t;$("s3d").textContent=t.s3d;$("branchL").textContent=t.branch;$("contractL").textContent=t.contract;
 $("s4t").textContent=t.s4t;$("s4d").textContent=t.s4d;$("driverL").textContent=t.driver;$("driverNameL").textContent=t.name;$("driverEmailL").textContent=t.email;$("driverPhoneL").textContent=t.phone;$("licenseL").textContent=t.license;
 $("s5t").textContent=t.s5t;$("s5d").textContent=t.s5d;$("dateL").textContent=t.date;$("descL").textContent=t.desc;$("locL").textContent=t.loc;$("gpsBtn").textContent=t.gps;$("photosL").textContent=t.photos;$("photoHelp").textContent=t.photoHelp;
 $("s6t").textContent=t.s6t;$("s6d").textContent=t.s6d;$("sendBtn").textContent=t.send;$("s7t").textContent=t.s7t;$("s7d").textContent=t.s7d;
 ["2","3","4","5","6"].forEach(n=>{if($("back"+n))$("back"+n).textContent=t.back;if($("next"+n))$("next"+n).textContent=t.next});
 $("branch").innerHTML=branches[l].map(x=>`<option>${x}</option>`).join("");
 $("driverType").innerHTML=`<option value="">${t.choose}</option><option value="main">${t.main}</option><option value="other">${t.other}</option>`;
 ["hr","en","de","it","fr"].forEach(x=>$("lang-"+x).classList.toggle("active",x===l));
 update();
}

function update(){
 for(let i=1;i<=7;i++)$("step"+i).classList.toggle("hidden",i!==current);
 $("num").textContent=current;$("fill").style.width=(current/7*100)+"%";
 if(current===6)buildSummary();
}

function error(id){$(id).textContent="⚠️ "+D[lang].req;return false}
function validate(){
 if(current===1)return true;
 if(current===3){
  if(!$("contract").value.trim())return error("step3err");
 }
 if(current===4){
  if(!$("driverType").value)return error("step4err");
  if($("driverType").value==="other" &&
    (!$("driverName").value.trim()||!$("driverEmail").value.trim()||!$("driverPhone").value.trim()||!$("license").files.length))
    return error("step4err");
 }
 if(current===5){
  if(!$("date").value||!$("desc").value.trim()||!$("location").value.trim()||!$("photos").files.length)return error("step5err");
 }
 return true;
}
function next(){if(!validate())return;if(current<7){current++;update()}}
function prev(){if(current>1){current--;update()}}
function toggleOtherDriver(){$("otherDriver").classList.toggle("hidden",$("driverType").value!=="other");$("step4err").textContent=""}
function getLocation(){
 if(!navigator.geolocation){$("gps").textContent="GPS nije podržan.";return}
 navigator.geolocation.getCurrentPosition(p=>{
  $("location").value=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6);
  $("gps").textContent="✓";
 },()=>{$("gps").textContent="⚠️"})
}
$("photos").addEventListener("change",function(){
 $("preview").innerHTML="";
 [...this.files].forEach(f=>{const r=new FileReader();r.onload=e=>{const img=document.createElement("img");img.src=e.target.result;$("preview").appendChild(img)};r.readAsDataURL(f)})
});
function buildSummary(){
 const t=D[lang],driver=$("driverType").value==="other"?$("driverName").value:t.main;
 $("summary").innerHTML=[
  [t.branch,$("branch").value],[t.contract,$("contract").value],[t.driver,driver],
  [t.date,$("date").value],[t.loc,$("location").value],[t.desc,$("desc").value],
  [t.photos,$("photos").files.length]
 ].map(x=>`<div><b>${x[0]}</b>${String(x[1]).replace(/</g,"&lt;")}</div>`).join("");
}
function send(){current=7;update()}
setLang("hr");
</script>
</body>
</html>
